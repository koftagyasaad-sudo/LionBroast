<!doctype html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بروست الأسد — غير متصل</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0F1115; color:#F6F4EF;
         font-family:"Readex Pro",system-ui,sans-serif; text-align:center; padding:24px; }
  .card { max-width:420px; border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:40px 28px;
          background:#181A20; }
  img { width:120px; height:120px; border-radius:999px; object-fit:cover; margin-bottom:16px;
        box-shadow:0 10px 40px -8px rgba(255,102,0,.45); }
  h1 { font-size:28px; font-weight:800; margin:0 0 8px; }
  p { color:#A6ACB8; margin:0 0 20px; line-height:1.8; }
  a { display:inline-block; background:#FF6600; color:#fff; text-decoration:none; font-weight:700;
      padding:12px 28px; border-radius:999px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/img/icon-512.png" alt="Broast El-Assad" />
    <h1>النت وقع منك!</h1>
    <p>الفرن شغال وإحنا مستنيين — أول ما النت يرجع هتلاقي المنيو وهيطهي الكرسبي.</p>
    <a href="/">حاول تاني</a>
  </div>
</body>
</html>
